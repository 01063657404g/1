<style>
/* Layout: sticky header with tabs; single centered column (max 880px); exam = one question per screen with ring timer */
:root{

.ring{position:relative;width:64px;height:64px;flex:none}

.ring circle{fill:none;stroke-width:6}

.ring.low .fg{stroke:var(--bad)}

.qtext{font-size:1.2rem;font-weight:700;line-height:1.7;margin:6px 0 14px;text-wrap:pretty}
.verse{background:var(--verse-bg);border:1px solid var(--verse-line);border-radius:10px;color:var(--verse-ink);font-family:var(--f-verse);

.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{width:100%;text-align:start;font:inherit;font-size:1.02rem;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}

.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}

.status{font-weight:700;font-size:.95rem}
.status.ok{color:var(--ok)} .status.bad{color:var(--bad)} .status.t{color:var(--warn)}

.expl p{margin:0}

.big{font-family:var(--f-verse);font-size:3.2rem;font-weight:700;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.era-row{display:grid;grid-template-columns:90px 1fr 56px;gap:10px;align-items:center;margin:6px 0;font-size:.92rem}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 10px}

table{border-collapse:collapse;width:100%;min-width:520px;background:var(--surface)}

function start(i){
  stop();S.m=i;S.cur=0;S.ans=[];S.filter="all";
  S.qs=MODELS[i].d.map(function(q,j){
    var o=[{t:q[3],ok:true},{t:q[4]},{t:q[5]},{t:q[6]}];
    return{era:q[0],q:q[1],v:q[2],o:shuffle(o),e:q[7],tr:(window.TR&&window.TR[i])?window.TR[i][j]:null}});
  tab("exam");show();window.scrollTo(0,0);
}
function runTimer(){stop();S.timer=setInterval(function(){S.left-=0.2;tick();if(S.left<=0){timeout()}},200)}
function stop(){if(S.timer){clearInterval(S.timer);S.timer=null}}
function show(){
  var q=S.qs[S.cur],n=S.qs.length;S.locked=false;
  var h='<div class="ex-head"><div class="info"><div><b>'+MODELS[S.m].n+'</b> · السؤال '+(S.cur+1)+' من '+n+' <span class="chip era">'+ERA_FULL[q.era]+'</span></div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+n+'" aria-valuenow="'+S.cur+'"><i style="width:'+(S.cur/n*100)+'%"></i></div></div>'

  q.o.forEach(function(o,k){h+='<li><button class="opt" type="button" data-k="'+k+'"><span class="k">'+LETTERS[k]+'</span><span dir="auto">'+esc(o.t)+'</span></button></li>'});

function tick(){
  var l=Math.max(0,S.left),fg=document.getElementById("fg"),sec=document.getElementById("sec"),ring=document.getElementById("ring");
  if(!fg)return;fg.setAttribute("stroke-dashoffset",(175.93*(1-l/SECS)).toFixed(2));sec.textContent=Math.ceil(l);ring.classList.toggle("low",l<=8);
}
function reveal(sel){
  stop();S.locked=true;var q=S.qs[S.cur];S.ans[S.cur]=sel;
  app.querySelectorAll(".opt").forEach(function(b,k){b.disabled=true;if(q.o[k].ok)b.classList.add("ok");else if(k===sel)b.classList.add("bad")});
  var st=sel<0?'<span class="status t">انتهى الوقت</span>':(q.o[sel].ok?'<span class="status ok">إجابة صحيحة ✓</span>':'<span class="status bad">إجابة خاطئة ✗</span>');
  var last=S.cur===S.qs.length-1;
  document.getElementById("after").innerHTML='<div class="actions">'+st+'<span class="sp"></span><button class="btn ghost" id="ex" type="button" aria-expanded="false">💡 شرح</button><button class="btn" id="nx" type="button">'+(last?"إنهاء وعرض النتيجة":"السؤال التالي")+'</button></div><div class="expl" id="exb" hidden><p>'+esc(q.e)+'</p></div>';
  document.getElementById("ex").onclick=function(){var b=document.getElementById("exb");b.hidden=!b.hidden;this.setAttribute("aria-expanded",!b.hidden)};
  var nx=document.getElementById("nx");nx.onclick=next;nx.focus({preventScroll:true});

function pick(k){if(!S.locked)reveal(k)}
function timeout(){if(!S.locked)reveal(-1)}
function next(){if(S.cur<S.qs.length-1){S.cur++;show();window.scrollTo(0,0)}else finish()}
document.addEventListener("keydown",function(e){
